<ellipse cx="248.0" cy="304.0" rx="5.0" ry="5.0" fill="#000000" stroke="#000000" stroke-width="1.0"/>
<text x="0.0" y="0.0" text-anchor="start" font-size="11" fill="#000000" font-weight="normal"></text>
<text x="230.0" y="362.0" text-anchor="middle" font-size="11" fill="#000000" font-weight="normal">18 tomato prompts: early / late / leaf blight,</text>
<text x="230.0" y="377.0" text-anchor="middle" font-size="11" fill="#000000" font-weight="normal">leaf mold … differ by one or two words</text>
<text x="42.0" y="146.0" text-anchor="start" font-size="11" fill="#000000" font-weight="bold">Same-crop prompts nearly identical: cos 0.875</text>
<rect x="104.0" y="214.0" width="12.0" height="12.0" fill="#BDD7EE" stroke="#000000" stroke-width="1.2"/>
<text x="110.0" y="206.0" text-anchor="middle" font-size="11" fill="#000000" font-weight="normal">image: tomato early blight</text>
<polyline points="116.0,224.0 208.0,271.0" fill="none" stroke="#595959" stroke-width="0.8" stroke-dasharray="5 3"/>
<polyline points="116.0,224.0 242.0,267.0" fill="none" stroke="#595959" stroke-width="0.8" stroke-dasharray="5 3"/>
<polyline points="116.0,224.0 212.0,305.0" fill="none" stroke="#595959" stroke-width="0.8" stroke-dasharray="5 3"/>
<polyline points="116.0,224.0 244.0,301.0" fill="none" stroke="#595959" stroke-width="0.8" stroke-dasharray="5 3"/>
<text x="42.0" y="420.0" text-anchor="start" font-size="11" fill="#000000" font-weight="normal">The image is close to the crop, but every disease prompt</text>
<text x="42.0" y="436.0" text-anchor="start" font-size="11" fill="#000000" font-weight="normal">is almost equally close: the disease is decided by noise.</text>
<rect x="460.0" y="80.0" width="400.0" height="380.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.0"/>
<text x="472.0" y="104.0" text-anchor="start" font-size="13" fill="#000000" font-weight="bold">(b) v3: name + symptom description</text>
<text x="472.0" y="124.0" text-anchor="start" font-size="11" fill="#000000" font-weight="normal" font-style="italic">“… with {disease}: {visual symptoms}.”</text>
<ellipse cx="565.0" cy="295.0" rx="6.0" ry="6.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
<text x="555.0" y="317.0" text-anchor="end" font-size="11" fill="#000000" font-weight="normal">crop component</text>
<text x="555.0" y="331.0" text-anchor="end" font-size="11" fill="#000000" font-weight="normal">(“tomato”)</text>
<polyline points="570.0,295.0 654.0,203.0" fill="none" stroke="#000000" stroke-width="1.0" marker-end="url(#a)"/>
