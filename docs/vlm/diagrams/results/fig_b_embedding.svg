<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="530" viewBox="0 0 1320 530" font-family="Arial, Helvetica, sans-serif" fill="#000000">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker></defs>
<rect width="1320" height="530" fill="white"/>
<text x="30.0" y="34.0" text-anchor="start" font-size="18" fill="#000000" font-weight="bold">How disease descriptions change the embedding space (zero-shot CLIP, v1 → v3)</text>
<text x="30.0" y="56.0" text-anchor="start" font-size="12" fill="#595959" font-weight="normal">Panels (a) and (b) are schematic; all numbers are measured on the 3,448 test images. Both encoders are frozen.</text>
<rect x="30.0" y="80.0" width="400.0" height="380.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.0"/>
<text x="42.0" y="104.0" text-anchor="start" font-size="13" fill="#000000" font-weight="bold">(a) v1: name-only prompts</text>
<text x="42.0" y="124.0" text-anchor="start" font-size="11" fill="#000000" font-weight="normal" font-style="italic">“a photo of tomato leaves with {disease}.”</text>
<ellipse cx="230.0" cy="290.0" rx="52.0" ry="52.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.0" stroke-dasharray="5 3"/>
<ellipse cx="212.0" cy="274.0" rx="5.0" ry="5.0" fill="#000000" stroke="#000000" stroke-width="1.0"/>
<text x="0.0" y="0.0" text-anchor="start" font-size="11" fill="#000000" font-weight="normal"></text>
<ellipse cx="246.0" cy="270.0" rx="5.0" ry="5.0" fill="#000000" stroke="#000000" stroke-width="1.0"/>
<text x="0.0" y="0.0" text-anchor="start" font-size="11" fill="#000000" font-weight="normal"></text>
<ellipse cx="216.0" cy="308.0" rx="5.0" ry="5.0" fill="#000000" stroke="#000000" stroke-width="1.0"/>
