<text x="30.0" y="490.0" text-anchor="start" font-size="11" fill="#595959" font-weight="normal">Crop signal: score of the image&#x27;s own-crop prompts minus the other crops&#x27; prompts.   Disease signal: score of the right-disease prompt minus the wrong-disease prompts of the same crop.</text>
<text x="30.0" y="509.0" text-anchor="start" font-size="11" fill="#595959" font-weight="normal">Within-crop wins: share of images whose correct prompt beats every other prompt of its crop.   Disease signal v1 → v3: +56%; crop signal: +3%.</text>
