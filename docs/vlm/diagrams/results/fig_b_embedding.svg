<text x="710.0" y="294.0" text-anchor="start" font-size="11" fill="#000000" font-weight="normal">late blight</text>
<text x="710.0" y="308.0" text-anchor="start" font-size="10" fill="#595959" font-weight="normal" font-style="italic">dark water-soaked patches</text>
<polyline points="570.0,295.0 634.0,372.0" fill="none" stroke="#000000" stroke-width="1.0" marker-end="url(#a)"/>
<ellipse cx="640.0" cy="375.0" rx="5.0" ry="5.0" fill="#000000" stroke="#000000" stroke-width="1.0"/>
<text x="650.0" y="379.0" text-anchor="start" font-size="11" fill="#000000" font-weight="normal">leaf mold</text>
<text x="650.0" y="393.0" text-anchor="start" font-size="10" fill="#595959" font-weight="normal" font-style="italic">olive-green velvety mould</text>
<text x="635.0" y="237.0" text-anchor="start" font-size="10" fill="#595959" font-weight="normal">symptom</text>
<text x="635.0" y="249.0" text-anchor="start" font-size="10" fill="#595959" font-weight="normal">component</text>
<rect x="671.0" y="165.0" width="12.0" height="12.0" fill="#BDD7EE" stroke="#000000" stroke-width="1.2"/>
<text x="689.0" y="175.0" text-anchor="start" font-size="11" fill="#000000" font-weight="normal">image: tomato early blight</text>
<polyline points="676.0,178.0 661.0,193.0" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#a)"/>
<text x="472.0" y="146.0" text-anchor="start" font-size="11" fill="#000000" font-weight="bold">Same-crop prompts spread apart: cos 0.842</text>
<text x="472.0" y="420.0" text-anchor="start" font-size="11" fill="#000000" font-weight="normal">Symptom words point where leaf images actually lie, so the</text>
<text x="472.0" y="436.0" text-anchor="start" font-size="11" fill="#000000" font-weight="normal">right disease prompt is now measurably closer to the image.</text>
