<text x="30.0" y="704.0" text-anchor="start" font-size="12" fill="#1B1F24" font-weight="normal">Last bar: the final pipeline with calibrated stacking (routing offset γ = 3.0, chosen on validation), which subtracts γ from every seen score: seen 72.9 → 66.8, unseen 48.3 → 82.8.</text>
<text x="30.0" y="724.0" text-anchor="start" font-size="12" fill="#1B1F24" font-weight="normal">Hatched bar: Hein&#x27;s re-run of the same un-anchored GAN (v11.3 settings) in his pipeline, the matched baseline for crop anchoring. v11.3 → re-run (44.0 → 46.3) is run-to-run difference, not a method change.</text>
<text x="30.0" y="744.0" text-anchor="start" font-size="12" fill="#1B1F24" font-weight="normal">“+ disease-only head” also brings in the ConvNeXt crop scores (measured alone: 49.0 → 50.9) and two-expert routing; the final step hands seen predictions to the ConvNeXt (+104 net correct seen images).</text>
<text x="30.0" y="764.0" text-anchor="start" font-size="12" fill="#1B1F24" font-weight="normal">Read with care: at γ = 0, HM mostly tracks how seen-biased a model is (r = 1.00 with the share of unseen images routed to unseen pairs, 25 LoRA runs), not how well it recognises.</text>
<text x="30.0" y="784.0" text-anchor="start" font-size="12" fill="#1B1F24" font-weight="normal">Example: training CSP longer (v4, 3 epochs → v4.2, 13 epochs) lowers HM at γ = 0 from 34.9 to 26.0 with AUSUC unchanged (38.4); LoRA then adds +17.5 AUSUC. Calibrated HM is the protocol&#x27;s headline number.</text>
</svg>