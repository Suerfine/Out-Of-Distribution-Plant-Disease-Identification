<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="640" viewBox="0 0 1240 640" font-family="Helvetica, Arial, sans-serif" fill="#1B1F24">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs>
<rect width="1240" height="640" fill="white"/>
<text x="30" y="36" text-anchor="start" font-size="19" fill="#1B1F24" font-weight="bold">Why zero-shot CLIP (v1) finds the crop but not the disease</text>
<text x="30" y="60" text-anchor="start" font-size="13" fill="#495057" font-weight="normal">Worked example: the 472 test images of the unseen pair “tomato early blight”. Every number is from the v1 test run.</text>
<rect x="30" y="100" width="220" height="60" rx="8" fill="#EAF6EC" stroke="#4C9A66" stroke-width="1.4"/>
<text x="140.0" y="125.55" text-anchor="middle" font-size="13" font-weight="bold">Test image</text>
<text x="140.0" y="143.55" text-anchor="middle" font-size="13" font-weight="normal">tomato leaf, early blight</text>
<line x1="140" y1="160" x2="140" y2="190" stroke="#495057" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="30" y="190" width="220" height="52" rx="8" fill="#F1F3F5" stroke="#868E96" stroke-width="1.4"/>
<text x="140.0" y="211.55" text-anchor="middle" font-size="13" font-weight="bold">CLIP image encoder</text>
<text x="140.0" y="229.55" text-anchor="middle" font-size="13" font-weight="normal">(frozen, no training)</text>
<line x1="250" y1="216" x2="330" y2="300" stroke="#495057" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="30" y="300" width="220" height="70" rx="8" fill="#EAF6EC" stroke="#4C9A66" stroke-width="1.4"/>
<text x="140.0" y="322.2" text-anchor="middle" font-size="12" font-weight="bold">333 prompts, one per pair</text>
<text x="140.0" y="339.2" text-anchor="middle" font-size="12" font-weight="normal">“a photo of tomato leaves</text>
<text x="140.0" y="356.2" text-anchor="middle" font-size="12" font-weight="normal">with early blight.”</text>
<line x1="140" y1="370" x2="140" y2="400" stroke="#495057" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="30" y="400" width="220" height="52" rx="8" fill="#F1F3F5" stroke="#868E96" stroke-width="1.4"/>
<text x="140.0" y="421.55" text-anchor="middle" font-size="13" font-weight="bold">CLIP text encoder</text>
<text x="140.0" y="439.55" text-anchor="middle" font-size="13" font-weight="normal">(frozen, no training)</text>
<line x1="250" y1="426" x2="330" y2="400" stroke="#495057" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="330" y="90" width="520" height="430" rx="12" fill="#FAFBFC" stroke="#ADB5BD" stroke-dasharray="6 4"/>
<text x="346" y="114" text-anchor="start" font-size="13" fill="#495057" font-weight="bold">Shared embedding space (cosine similarity = closeness)</text>
<circle cx="470" cy="220" r="50" fill="#C9504A" fill-opacity="0.10" stroke="#C9504A" stroke-width="1.2"/>
<circle cx="440.8" cy="217.8" r="3.2" fill="#C9504A"/>
<circle cx="488.0" cy="243.0" r="3.2" fill="#C9504A"/>
<circle cx="462.6" cy="238.1" r="3.2" fill="#C9504A"/>
<circle cx="479.0" cy="203.1" r="3.2" fill="#C9504A"/>
<circle cx="465.3" cy="218.5" r="3.2" fill="#C9504A"/>
<circle cx="470.5" cy="198.0" r="3.2" fill="#C9504A"/>
<circle cx="457.2" cy="243.4" r="3.2" fill="#C9504A"/>
<circle cx="463.4" cy="239.1" r="3.2" fill="#C9504A"/>
<circle cx="482.7" cy="234.2" r="3.2" fill="#C9504A"/>
<circle cx="474.4" cy="234.7" r="3.2" fill="#C9504A"/>
<circle cx="470.0" cy="204.1" r="3.2" fill="#C9504A"/>
<circle cx="440.4" cy="222.8" r="3.2" fill="#C9504A"/>
<circle cx="494.8" cy="213.9" r="3.2" fill="#C9504A"/>
<circle cx="454.7" cy="216.0" r="3.2" fill="#C9504A"/>
<text x="470" y="286" text-anchor="middle" font-size="12" fill="#C9504A" font-weight="bold">apple prompts</text>
<circle cx="740" cy="175" r="44" fill="#4C9A66" fill-opacity="0.10" stroke="#4C9A66" stroke-width="1.2"/>
<circle cx="738.9" cy="189.4" r="3.2" fill="#4C9A66"/>
<circle cx="743.1" cy="167.6" r="3.2" fill="#4C9A66"/>
<circle cx="721.8" cy="161.7" r="3.2" fill="#4C9A66"/>
<circle cx="742.4" cy="180.7" r="3.2" fill="#4C9A66"/>
<circle cx="736.7" cy="196.1" r="3.2" fill="#4C9A66"/>
<circle cx="730.5" cy="171.1" r="3.2" fill="#4C9A66"/>
<circle cx="720.3" cy="183.9" r="3.2" fill="#4C9A66"/>
<circle cx="721.4" cy="184.8" r="3.2" fill="#4C9A66"/>
<circle cx="761.4" cy="170.6" r="3.2" fill="#4C9A66"/>
<circle cx="731.1" cy="182.2" r="3.2" fill="#4C9A66"/>
<text x="740" y="235" text-anchor="middle" font-size="12" fill="#4C9A66" font-weight="bold">rice prompts</text>
<circle cx="560" cy="355" r="64" fill="#2F6FD0" fill-opacity="0.10" stroke="#2F6FD0" stroke-width="1.2"/>
<circle cx="576.0" cy="364.6" r="3.2" fill="#2F6FD0"/>
<circle cx="569.3" cy="327.2" r="3.2" fill="#2F6FD0"/>
<circle cx="581.0" cy="369.1" r="3.2" fill="#2F6FD0"/>
<circle cx="544.8" cy="357.0" r="3.2" fill="#2F6FD0"/>
<circle cx="558.7" cy="342.1" r="3.2" fill="#2F6FD0"/>
<circle cx="538.6" cy="372.4" r="3.2" fill="#2F6FD0"/>
<circle cx="533.3" cy="367.4" r="3.2" fill="#2F6FD0"/>
<text x="560" y="435" text-anchor="middle" font-size="12" fill="#2F6FD0" font-weight="bold">tomato prompts (18 pairs)</text>
<circle cx="760" cy="380" r="38" fill="#7048A8" fill-opacity="0.10" stroke="#7048A8" stroke-width="1.2"/>
<circle cx="775.3" cy="374.3" r="3.2" fill="#7048A8"/>
<circle cx="766.4" cy="379.0" r="3.2" fill="#7048A8"/>
<circle cx="749.1" cy="371.3" r="3.2" fill="#7048A8"/>
<circle cx="763.1" cy="371.0" r="3.2" fill="#7048A8"/>
<circle cx="771.6" cy="367.9" r="3.2" fill="#7048A8"/>
<circle cx="772.9" cy="370.9" r="3.2" fill="#7048A8"/>
<text x="760" y="434" text-anchor="middle" font-size="12" fill="#7048A8" font-weight="bold">soybean prompts</text>
<text x="760" y="452" text-anchor="middle" font-size="11" fill="#1B1F24" font-weight="bold">★ hub: soybean bacterial blight</text>
<text x="504" y="329" text-anchor="start" font-size="10" fill="#2F6FD0" font-weight="bold">early blight</text>
<text x="564" y="323" text-anchor="start" font-size="10" fill="#2F6FD0" font-weight="bold">late blight</text>
<text x="520" y="363" text-anchor="start" font-size="10" fill="#2F6FD0" font-weight="bold">leaf blight</text>
<text x="568" y="381" text-anchor="start" font-size="10" fill="#2F6FD0" font-weight="bold">leaf mold</text>
<polygon points="735,364 738.5,371.5 746,372 740,377.5 742,385 735,381 728,385 730,377.5 724,372 731.5,371.5" fill="#C99A2E" stroke="#1B1F24" stroke-width="0.8"/>
<circle cx="640" cy="265" r="8" fill="#4C9A66" stroke="#1B1F24" stroke-width="1"/>
<text x="626" y="269" text-anchor="end" font-size="11" fill="#4C9A66" font-weight="bold">image embedding</text>
<line x1="635" y1="272" x2="590" y2="318" stroke="#2F6FD0" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="646" y1="272" x2="729" y2="363" stroke="#C99A2E" stroke-width="1.4" marker-end="url(#a)"/>
<text x="346" y="478" text-anchor="start" font-size="12" fill="#1B1F24" font-weight="normal">Prompts that share the crop word:  cos 0.87</text>
<text x="346" y="496" text-anchor="start" font-size="12" fill="#1B1F24" font-weight="normal">Prompts that share the disease words:  cos 0.80</text>
<text x="346" y="514" text-anchor="start" font-size="12" fill="#495057" font-weight="normal">Prompts that share neither:  cos 0.69</text>
<rect x="880" y="90" width="330" height="110" rx="8" fill="#FFF4D6" stroke="#C99A2E" stroke-width="1.4"/>
<text x="1045.0" y="123.7" text-anchor="middle" font-size="12" font-weight="bold">1  The crop is found, roughly</text>
<text x="1045.0" y="140.7" text-anchor="middle" font-size="12" font-weight="normal">Top-1 pair has the right crop: 38%</text>
<text x="1045.0" y="157.7" text-anchor="middle" font-size="12" font-weight="normal">(random guess 4%; 10x chance)</text>
<text x="1045.0" y="174.7" text-anchor="middle" font-size="12" font-weight="normal">This example: 20% land in a tomato prompt</text>
<rect x="880" y="215" width="330" height="110" rx="8" fill="#FFF4D6" stroke="#C99A2E" stroke-width="1.4"/>
<text x="1045.0" y="248.7" text-anchor="middle" font-size="12" font-weight="bold">2  The disease is close to a coin toss</text>
<text x="1045.0" y="265.7" text-anchor="middle" font-size="12" font-weight="normal">Even with the crop given: 18% right</text>
<text x="1045.0" y="282.7" text-anchor="middle" font-size="12" font-weight="normal">(random guess 12%; 1.4x chance)</text>
<text x="1045.0" y="299.7" text-anchor="middle" font-size="12" font-weight="normal">Same-crop prompts differ by one or two words</text>
<rect x="880" y="340" width="330" height="110" rx="8" fill="#FFF4D6" stroke="#C99A2E" stroke-width="1.4"/>
<text x="1045.0" y="373.7" text-anchor="middle" font-size="12" font-weight="bold">3  A few hub prompts win the ties</text>
<text x="1045.0" y="390.7" text-anchor="middle" font-size="12" font-weight="normal">soybean bacterial blight: 258 of 3448 predictions</text>
<text x="1045.0" y="407.7" text-anchor="middle" font-size="12" font-weight="normal">but only 1 true test image</text>
<text x="1045.0" y="424.7" text-anchor="middle" font-size="12" font-weight="normal">129 of the 472 tomato early blight images go to it</text>
<rect x="880" y="465" width="330" height="55" rx="8" fill="#FFFFFF" stroke="#C9504A" stroke-width="1.6"/>
<text x="1045.0" y="488.2" text-anchor="middle" font-size="12" font-weight="bold">Result: right pair for 5.7% of images</text>
<text x="1045.0" y="505.2" text-anchor="middle" font-size="12" font-weight="normal">seen 6.4%, unseen 4.6%, HM 5.4% (chance 0.3%)</text>
<text x="30" y="570" text-anchor="start" font-size="12" fill="#495057" font-weight="normal">Reading the figure: an image is assigned to the prompt with the highest cosine similarity. CLIP&#x27;s pretraining (internet image-caption pairs) taught it crop names well and rare disease names poorly,</text>
<text x="30" y="590" text-anchor="start" font-size="12" fill="#495057" font-weight="normal">so the text embedding of a prompt is dominated by its crop word. The image lands near the right crop&#x27;s prompts, but those prompts sit almost on top of each other (cos 0.87),</text>
<text x="30" y="610" text-anchor="start" font-size="12" fill="#495057" font-weight="normal">so tiny, meaningless differences decide the disease, and prompts that happen to sit close to many leaf images (hubs) collect predictions from every crop.</text>
</svg>