<svg xmlns="http://www.w3.org/2000/svg" width="1090" height="230" viewBox="0 0 1090 230" font-family="Arial, Helvetica, sans-serif" fill="#000000">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker></defs>
<rect width="1090" height="230" fill="white"/>
<rect x="0.0" y="0.0" width="1090.0" height="230.0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/>
<rect x="10.0" y="10.0" width="240.0" height="56.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
<text x="130.0" y="34.5" text-anchor="middle" font-size="14" fill="#000000" font-weight="bold">Anchor a</text>
<text x="130.0" y="51.5" text-anchor="middle" font-size="13" fill="#000000" font-weight="normal">real healthy feature of the target crop</text>
<rect x="10.0" y="120.0" width="240.0" height="56.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
<text x="130.0" y="144.5" text-anchor="middle" font-size="14" fill="#000000" font-weight="bold">Pair text embedding</text>
<text x="130.0" y="161.5" text-anchor="middle" font-size="13" fill="#000000" font-weight="normal">+ random noise z</text>
<rect x="300.0" y="120.0" width="230.0" height="56.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="415.0" y="144.5" text-anchor="middle" font-size="14" fill="#000000" font-weight="bold">Generator G</text>
<text x="415.0" y="161.5" text-anchor="middle" font-size="13" fill="#000000" font-weight="normal">outputs disease offset Δ</text>
<rect x="580.0" y="65.0" width="50.0" height="46.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
<text x="605.0" y="93.0" text-anchor="middle" font-size="14" fill="#000000" font-weight="bold">+</text>
<rect x="680.0" y="60.0" width="220.0" height="56.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
<text x="790.0" y="84.5" text-anchor="middle" font-size="14" fill="#000000" font-weight="bold">Synthetic feature</text>
<text x="790.0" y="101.5" text-anchor="middle" font-size="13" fill="#000000" font-weight="normal">x̃ = normalise(a + Δ)</text>
<rect x="940.0" y="60.0" width="140.0" height="56.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="1010.0" y="84.5" text-anchor="middle" font-size="14" fill="#000000" font-weight="bold">Classifier</text>
<text x="1010.0" y="101.5" text-anchor="middle" font-size="13" fill="#000000" font-weight="normal">as in E</text>
<polyline points="250.0,148.0 300.0,148.0" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#a)"/>
<polyline points="250.0,38.0 605.0,38.0 605.0,65.0" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#a)"/>
<polyline points="530.0,148.0 605.0,148.0 605.0,111.0" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#a)"/>
<polyline points="630.0,88.0 680.0,88.0" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#a)"/>
<polyline points="900.0,88.0 940.0,88.0" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#a)"/>
<text x="10.0" y="200.0" text-anchor="start" font-size="12" fill="#000000" font-weight="normal" font-style="italic">e.g. tomato early blight: a = a real healthy tomato leaf, Δ = the change early blight makes. The crop and leaf come from a real image; G only models the disease.</text>
<rect x="10.0" y="212.0" width="30.0" height="14.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.2" stroke-dasharray="5 3"/>
<text x="46.0" y="224.0" text-anchor="start" font-size="12" fill="#000000" font-weight="normal">learned / trainable</text>
<rect x="220.0" y="212.0" width="30.0" height="14.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
<text x="256.0" y="224.0" text-anchor="start" font-size="12" fill="#000000" font-weight="normal">fixed / frozen</text>
</svg>