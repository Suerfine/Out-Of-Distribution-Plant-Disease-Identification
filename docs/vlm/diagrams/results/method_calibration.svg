<svg xmlns="http://www.w3.org/2000/svg" width="1090" height="230" viewBox="0 0 1090 230" font-family="Arial, Helvetica, sans-serif" fill="#000000">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker></defs>
<rect width="1090" height="230" fill="white"/>
<rect x="0.0" y="0.0" width="1090.0" height="230.0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/>
<rect x="10.0" y="10.0" width="210.0" height="56.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
<text x="115.0" y="34.5" text-anchor="middle" font-size="14" fill="#000000" font-weight="bold">333 pair scores</text>
<text x="115.0" y="51.5" text-anchor="middle" font-size="13" fill="#000000" font-weight="normal">s(x, c)</text>
<rect x="260.0" y="10.0" width="260.0" height="56.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
<text x="390.0" y="34.5" text-anchor="middle" font-size="14" fill="#000000" font-weight="bold">Subtract γ</text>
<text x="390.0" y="51.5" text-anchor="middle" font-size="13" fill="#000000" font-weight="normal">from the 323 seen pairs only</text>
<rect x="560.0" y="10.0" width="160.0" height="56.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
<text x="640.0" y="43.0" text-anchor="middle" font-size="14" fill="#000000" font-weight="bold">argmax</text>
<rect x="760.0" y="10.0" width="160.0" height="56.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
<text x="840.0" y="43.0" text-anchor="middle" font-size="14" fill="#000000" font-weight="bold">Prediction</text>
<rect x="260.0" y="120.0" width="260.0" height="56.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
<text x="390.0" y="144.5" text-anchor="middle" font-size="14" fill="#000000" font-weight="bold">Validation split</text>
<text x="390.0" y="161.5" text-anchor="middle" font-size="13" fill="#000000" font-weight="normal">held-out seen pairs act as unseen</text>
<polyline points="220.0,38.0 260.0,38.0" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#a)"/>
<polyline points="520.0,38.0 560.0,38.0" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#a)"/>
<polyline points="720.0,38.0 760.0,38.0" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#a)"/>
<polyline points="390.0,120.0 390.0,66.0" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#a)"/>
<text x="400.0" y="98.0" text-anchor="start" font-size="12" fill="#000000" font-weight="normal">choose γ that maximises HM</text>
<text x="560.0" y="150.0" text-anchor="start" font-size="14" fill="#000000" font-weight="bold">ŷ = argmax c [ s(x, c) − γ · 1(c is seen) ]</text>
<text x="10.0" y="214.0" text-anchor="start" font-size="12" fill="#000000" font-weight="normal" font-style="italic">Unseen-pair scores are unchanged. γ is set on validation, never on the test set.</text>
</svg>